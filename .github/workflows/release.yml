name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # Required for OIDC auth to the MCP Registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          BINARY=gws-mcp

          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o "${BINARY}-darwin-arm64" ./cmd/gws-mcp
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o "${BINARY}-darwin-amd64" ./cmd/gws-mcp
          GOOS=linux  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o "${BINARY}-linux-amd64"  ./cmd/gws-mcp
          GOOS=linux  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o "${BINARY}-linux-arm64"  ./cmd/gws-mcp

      - name: Assemble MCPB bundle
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}

          mkdir -p bundle/server
          cp gws-mcp-darwin-arm64 gws-mcp-darwin-amd64 gws-mcp-linux-amd64 gws-mcp-linux-arm64 bundle/server/
          cp mcpb/launch.sh bundle/server/launch.sh
          chmod +x bundle/server/launch.sh bundle/server/gws-mcp-*

          sed "s/__VERSION__/${VERSION}/g" mcpb/manifest.json > bundle/manifest.json

          (cd bundle && zip -qr -X ../gws-mcp.mcpb manifest.json server)
          echo "Built gws-mcp.mcpb:"
          unzip -l gws-mcp.mcpb

      - name: Render server.json (version + asset URL + sha256)
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          SHA=$(sha256sum gws-mcp.mcpb | cut -d' ' -f1)
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s|__TAG__|${TAG}|g" \
              -e "s/__SHA256__/${SHA}/g" \
              server.json > server.rendered.json
          mv server.rendered.json server.json
          echo "Rendered server.json:"; cat server.json

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            gws-mcp-darwin-arm64
            gws-mcp-darwin-amd64
            gws-mcp-linux-amd64
            gws-mcp-linux-arm64
            gws-mcp.mcpb

      # Publish to the official MCP Registry. The .mcpb asset must be live on the
      # release (previous step) so the registry can verify the fileSha256.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/orieg/gws-connector
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
