name: Feature request
description: Suggest a new tool, workflow, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the Google Workspace workflow or pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What tool, parameter, or behavior would solve it? Name the Google API if you know it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mail
        - Calendar
        - Drive
        - Sheets
        - Docs
        - Tasks / other Google API
        - Account management / routing
        - Setup / onboarding
        - Docs / examples
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you use today, or other approaches you thought about.
